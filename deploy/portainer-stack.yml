# Portainer stack (Stacks -> Add stack -> Web editor). It uses a PRE-BUILT image only (no build
# context), so the image must already exist on the Docker host or in a registry it can pull from.
# See README, section "Docker and Portainer". Set the variables in the stack's "Environment variables".
services:
  wwp-launch-radar:
    image: ${WWP_IMAGE:-wwp-launch-radar:1.0.0}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${WWP_PUBLISH_PORT:-8765}:8765"
    environment:
      WWP_APP_ID: "${WWP_APP_ID:-3222640}"
      WWP_GAME_NAME: "${WWP_GAME_NAME:-Wild West Pioneers}"
      WWP_LAUNCH_AT: "${WWP_LAUNCH_AT:-}"
      WWP_DISPLAY_TZ: "Europe/Warsaw"
      # Required: the app refuses to start on 0.0.0.0 without it (or WWP_TRUST_PROXY_AUTH=true).
      WWP_DASHBOARD_PASSWORD: "${WWP_DASHBOARD_PASSWORD}"
      WWP_TRUST_PROXY_AUTH: "${WWP_TRUST_PROXY_AUTH:-false}"
      WWP_AI_ENABLED: "${WWP_AI_ENABLED:-false}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      WWP_TWITCH_CLIENT_ID: "${WWP_TWITCH_CLIENT_ID:-}"
      WWP_TWITCH_CLIENT_SECRET: "${WWP_TWITCH_CLIENT_SECRET:-}"
      WWP_TWITCH_CATEGORY: "${WWP_TWITCH_CATEGORY:-}"
    volumes:
      - wwp-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  wwp-data:
